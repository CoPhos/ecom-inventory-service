name: ecom-inventory

services:
  sqlserver:
    build: .
    container_name: sqlserver-2025-inventory
    ports:
      - "127.0.0.1:${INVENTORY_DB_PORT:-1434}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${INVENTORY_DB_SA_PASSWORD:-Toor123!}"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -C -b -l 3 -t 5 -d InventoryServiceDb
          -Q "SELECT TOP (0) reservation_id FROM inv.reservation_items;"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

volumes:
  sqlserver_data:
